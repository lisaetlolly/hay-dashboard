<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>种草内容管理系统 · Seeding Hub</title>
<style>
  :root {
    --primary: #FF2E4D;
    --primary-light: #FFE9ED;
    --primary-dark: #D81B3F;
    --bg: #F7F8FA;
    --card: #FFFFFF;
    --border: #EAECEF;
    --text: #1F2329;
    --text-secondary: #646A73;
    --text-muted: #8F959E;
    --success: #34C724;
    --warning: #FF8800;
    --danger: #F54A45;
    --info: #3370FF;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --radius: 8px;
    --radius-sm: 4px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  /* Login */
  .login-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #FF2E4D 0%, #FF6B8A 100%);
    z-index: 1000;
  }
  .login-card {
    background: white; border-radius: 12px; padding: 40px; width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .login-card h1 { font-size: 24px; margin-bottom: 8px; }
  .login-card p { color: var(--text-secondary); margin-bottom: 24px; font-size: 13px; }
  .login-card .role-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .role-btn {
    padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    text-align: left; transition: all 0.15s; display: flex; align-items: center; gap: 12px;
  }
  .role-btn:hover { border-color: var(--primary); background: var(--primary-light); }
  .role-btn .role-icon {
    width: 36px; height: 36px; border-radius: 8px; background: var(--primary-light);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .role-btn .role-name { font-weight: 600; }
  .role-btn .role-desc { font-size: 12px; color: var(--text-muted); }

  /* Layout */
  .app { display: none; height: 100vh; }
  .app.active { display: flex; }
  .sidebar {
    width: 220px; background: #FFFFFF; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .logo {
    width: 28px; height: 28px; border-radius: 6px;
    background: linear-gradient(135deg, var(--primary), #FF6B8A);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 14px;
  }
  .logo-text { font-weight: 600; font-size: 15px; }
  .nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
  .nav-section { margin-bottom: 16px; }
  .nav-section-title {
    font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;
    padding: 0 12px 4px; letter-spacing: 0.5px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer;
    transition: all 0.1s; font-size: 14px;
  }
  .nav-item:hover { background: var(--bg); color: var(--text); }
  .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 56px; background: white; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  }
  .breadcrumb { font-size: 16px; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .user-chip {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    border-radius: 20px; background: var(--bg); font-size: 13px; cursor: pointer;
  }
  .user-avatar {
    width: 24px; height: 24px; border-radius: 50%; background: var(--primary);
    color: white; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .user-role-tag {
    background: var(--primary); color: white; font-size: 10px; padding: 1px 6px; border-radius: 10px;
  }
  .content { flex: 1; overflow-y: auto; padding: 24px; }

  /* Components */
  .btn {
    padding: 7px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
    transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: white; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: #FFEAEA; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  .card {
    background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
    padding: 16px; box-shadow: var(--shadow-sm);
  }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .card-toolbar { display: flex; gap: 8px; }

  .input, .select, .textarea {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: white; transition: border-color 0.15s; outline: none;
  }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); }
  .textarea { resize: vertical; min-height: 80px; font-family: inherit; }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
  .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: white; padding: 16px 20px; border-radius: var(--radius);
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .stat-label { font-size: 12px; color: var(--text-muted); }
  .stat-value { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .stat-trend { font-size: 12px; margin-top: 4px; }
  .stat-trend.up { color: var(--success); }
  .stat-trend.down { color: var(--danger); }

  /* Tags */
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 10px; font-size: 12px;
    background: var(--bg); color: var(--text-secondary);
  }
  .tag.removable { padding-right: 4px; }
  .tag-close { cursor: pointer; padding: 0 2px; opacity: 0.5; }
  .tag-close:hover { opacity: 1; }
  .tag.image { background: #E8F3FF; color: #2C5BB1; }
  .tag.note-conv { background: #E8F8E8; color: #1B7A1B; }
  .tag.note-overflow { background: #FFF3E0; color: #B8550B; }
  .tag.note-exposure { background: #F0E8FF; color: #6840C7; }
  .tag.blogger { background: var(--primary-light); color: var(--primary-dark); }
  .tag.shipped { background: #E8F8E8; color: #1B7A1B; }
  .tag.pending { background: #FFF3E0; color: #B8550B; }
  .tag.delivered { background: #E8F3FF; color: #2C5BB1; }

  /* Tables */
  .table { width: 100%; border-collapse: collapse; }
  .table th, .table td {
    text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 13px; vertical-align: middle;
  }
  .table th { background: var(--bg); color: var(--text-secondary); font-weight: 500; font-size: 12px; }
  .table tbody tr:hover { background: #FAFAFA; }
  .table .actions { display: flex; gap: 4px; }

  /* Filter bar */
  .filter-bar {
    background: white; padding: 12px 16px; border-radius: var(--radius);
    border: 1px solid var(--border); margin-bottom: 16px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  .filter-bar .filter-item { display: flex; align-items: center; gap: 6px; }
  .filter-bar label { font-size: 12px; color: var(--text-muted); }

  /* Image grid */
  .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .image-card {
    background: white; border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; transition: all 0.15s; cursor: pointer;
  }
  .image-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .image-thumb {
    width: 100%; height: 180px; background: linear-gradient(135deg, #FFE9ED 0%, #FFD1DC 100%);
    display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 36px;
    background-size: cover; background-position: center;
  }
  .image-info { padding: 10px 12px; }
  .image-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .image-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white; border-radius: 8px; width: 560px; max-width: 90vw;
    max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-footer {
    padding: 12px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .modal-close { font-size: 20px; color: var(--text-muted); cursor: pointer; }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

  /* Tag picker */
  .tag-picker { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); min-height: 40px; background: white; }
  .tag-picker-input { border: none; outline: none; flex: 1; min-width: 100px; padding: 4px; }
  .tag-suggestions {
    background: white; border: 1px solid var(--border); border-radius: var(--radius-sm);
    margin-top: 4px; max-height: 200px; overflow-y: auto;
  }
  .tag-suggestion {
    padding: 6px 10px; cursor: pointer; font-size: 13px;
  }
  .tag-suggestion:hover { background: var(--primary-light); }

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; gap: 4px; }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 14px; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

  /* Bar chart */
  .bar-chart-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; font-size: 13px; }
  .bar-chart-row .label { width: 120px; flex-shrink: 0; }
  .bar-chart-row .bar-track { flex: 1; height: 18px; background: var(--bg); border-radius: 9px; overflow: hidden; }
  .bar-chart-row .bar-fill { height: 100%; background: var(--primary); border-radius: 9px; }
  .bar-chart-row .value { width: 60px; text-align: right; color: var(--text-secondary); font-size: 12px; }

  /* Copy library card */
  .copy-card {
    background: white; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px;
  }
  .copy-card .copy-content { font-size: 14px; line-height: 1.5; margin-bottom: 6px; }
  .copy-card .copy-meta { display: flex; justify-content: space-between; align-items: center; }

  /* Banned word highlight */
  .banned-word { background: #FFEAEA; color: var(--danger); padding: 1px 4px; border-radius: 3px; font-weight: 500; }

  /* Toast */
  .toast {
    position: fixed; top: 20px; right: 20px; background: #1F2329; color: white;
    padding: 10px 16px; border-radius: var(--radius); z-index: 200; box-shadow: var(--shadow-md);
    transform: translateX(120%); transition: transform 0.3s;
  }
  .toast.show { transform: translateX(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }

  /* Permission gate */
  .role-readonly .btn-primary { display: none; }
  .role-readonly .actions .btn-edit, .role-readonly .actions .btn-delete { display: none; }

  /* Tagger */
  .tagger-empty {
    background: white; border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 60px 20px; text-align: center; transition: all 0.2s;
  }
  .tagger-empty.dragover { border-color: var(--primary); background: var(--primary-light); }
  .tagger-empty .big-icon { font-size: 48px; color: var(--primary); margin-bottom: 12px; }
  .tagger-toolbar {
    background: white; padding: 12px 16px; border-radius: var(--radius);
    border: 1px solid var(--border); margin-bottom: 12px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .mode-switch { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .mode-switch button { padding: 6px 14px; font-size: 13px; background: white; color: var(--text-secondary); }
  .mode-switch button.active { background: var(--primary); color: white; }
  .progress-text { color: var(--text-muted); font-size: 13px; }
  .progress-bar { width: 200px; height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--primary); transition: width 0.2s; }

  /* Quick tagging mode (Tinder-style) */
  .quick-tagger { display: grid; grid-template-columns: 1fr 360px; gap: 16px; height: calc(100vh - 220px); }
  .quick-image-pane {
    background: #1F2329; border-radius: var(--radius); display: flex;
    flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    position: relative;
  }
  .quick-image-pane img, .quick-image-pane video {
    max-width: 100%; max-height: 100%; object-fit: contain;
  }
  .quick-image-meta {
    position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7));
    padding: 30px 16px 12px; color: white; font-size: 12px;
  }
  .quick-image-nav {
    position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4);
    color: white; width: 40px; height: 40px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; cursor: pointer; font-size: 18px; transition: background 0.15s;
  }
  .quick-image-nav:hover { background: rgba(0,0,0,0.6); }
  .quick-image-nav.prev { left: 12px; }
  .quick-image-nav.next { right: 12px; }
  .quick-tag-pane {
    background: white; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }
  .quick-tag-pane h3 { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
  .quick-tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .clickable-tag {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 16px;
    background: white; cursor: pointer; font-size: 13px; transition: all 0.1s; user-select: none;
  }
  .clickable-tag:hover { border-color: var(--primary); }
  .clickable-tag.selected { background: var(--primary); color: white; border-color: var(--primary); }
  .clickable-tag.suggested { border-color: var(--primary); color: var(--primary-dark); }
  .clickable-tag.suggested.selected { background: var(--primary); color: white; }
  .tag-add-input { padding: 6px 10px; border: 1px dashed var(--border); border-radius: 16px; font-size: 13px; background: white; min-width: 100px; outline: none; }
  .tag-add-input:focus { border-color: var(--primary); border-style: solid; }
  .quick-actions { margin-top: auto; display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
  .quick-actions .btn { flex: 1; justify-content: center; padding: 10px; }
  .keyboard-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 6px; }

  /* Batch mode */
  .batch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .batch-tile {
    position: relative; border: 2px solid transparent; border-radius: var(--radius);
    overflow: hidden; cursor: pointer; background: var(--bg); aspect-ratio: 1;
  }
  .batch-tile.selected { border-color: var(--primary); }
  .batch-tile img { width: 100%; height: 100%; object-fit: cover; }
  .batch-tile .tile-meta {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 6px;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    color: white; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .batch-tile .tile-tags {
    position: absolute; top: 4px; left: 4px; right: 4px; display: flex; flex-wrap: wrap; gap: 2px;
  }
  .batch-tile .tile-mini-tag {
    background: rgba(0,0,0,0.7); color: white; padding: 1px 4px; border-radius: 3px;
    font-size: 9px;
  }
  .batch-tile .tile-check {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--primary); color: white; display: none;
    align-items: center; justify-content: center; font-size: 12px;
  }
  .batch-tile.selected .tile-check { display: flex; }
  .batch-toolbar-floating {
    position: sticky; bottom: 16px; background: var(--text); color: white;
    padding: 10px 16px; border-radius: var(--radius); display: flex; gap: 12px; align-items: center;
    margin-top: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .batch-toolbar-floating .floating-tag { padding: 4px 10px; border: 1px solid #555; border-radius: 12px; cursor: pointer; font-size: 12px; }
  .batch-toolbar-floating .floating-tag.selected { background: var(--primary); border-color: var(--primary); }
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>种草内容管理系统</h1>
    <p>选择一个角色登录，体验不同权限。可以随时在右上角切换。</p>
    <div class="role-list">
      <button class="role-btn" onclick="login('admin')">
        <div class="role-icon">★</div>
        <div>
          <div class="role-name">管理员 Admin</div>
          <div class="role-desc">所有权限：增删改查、用户与标签管理</div>
        </div>
      </button>
      <button class="role-btn" onclick="login('editor')">
        <div class="role-icon">✎</div>
        <div>
          <div class="role-name">运营 Editor</div>
          <div class="role-desc">可录入与编辑数据，不能删除核心配置</div>
        </div>
      </button>
      <button class="role-btn" onclick="login('viewer')">
        <div class="role-icon">◎</div>
        <div>
          <div class="role-name">查看者 Viewer</div>
          <div class="role-desc">只读，可浏览数据与文案库</div>
        </div>
      </button>
    </div>
    <div style="font-size: 11px; color: var(--text-muted); margin-top: 12px;">
      数据保存在本地浏览器（localStorage），切换浏览器/清除缓存数据会丢失。如需多人协作请部署到服务端。
    </div>
  </div>
</div>

<!-- Main App -->
<div class="app" id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">种</div>
      <div class="logo-text">Seeding Hub</div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-section">
        <div class="nav-section-title">概览</div>
        <div class="nav-item active" data-view="dashboard"><span class="icon">◈</span>仪表盘</div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">内容资产</div>
        <div class="nav-item" data-view="tagger"><span class="icon">⚡</span>快速打标</div>
        <div class="nav-item" data-view="images"><span class="icon">▣</span>图片库</div>
        <div class="nav-item" data-view="copy"><span class="icon">✎</span>文案库</div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">投放</div>
        <div class="nav-item" data-view="kols"><span class="icon">◐</span>KOL 库</div>
        <div class="nav-item" data-view="seedings"><span class="icon">▶</span>Seeding 记录</div>
        <div class="nav-item" data-view="notes"><span class="icon">▤</span>笔记表现</div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">分析</div>
        <div class="nav-item" data-view="analytics"><span class="icon">⌬</span>数据分析</div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">系统</div>
        <div class="nav-item" data-view="tags"><span class="icon">◆</span>标签管理</div>
        <div class="nav-item" data-view="settings"><span class="icon">⚙</span>设置</div>
      </div>

function purgeDemoData_v1() {
  if (data.demoDataPurged_v1) return;
  const demoIds = {
    images:   new Set(['img1','img2','img3']),
    kols:     new Set(['k1','k2','k3']),
    seedings: new Set(['s1','s2']),
    notes:    new Set(['n1','n2']),
    titles:   new Set(['t1','t2']),
    slogans:  new Set(['sl1','sl2']),
    copy:     new Set(['c1','c2']),
    mascot:   new Set(['m1']),
  };
  if (Array.isArray(data.images))   data.images   = data.images.filter(x => !demoIds.images.has(x.id));
  if (Array.isArray(data.kols))     data.kols     = data.kols.filter(x => !demoIds.kols.has(x.id));
  if (Array.isArray(data.seedings)) data.seedings = data.seedings.filter(x => !demoIds.seedings.has(x.id));
  if (Array.isArray(data.notes))    data.notes    = data.notes.filter(x => !demoIds.notes.has(x.id));
  if (data.copy) {
    if (Array.isArray(data.copy.titles))  data.copy.titles  = data.copy.titles.filter(x => !demoIds.titles.has(x.id));
    if (Array.isArray(data.copy.slogans)) data.copy.slogans = data.copy.slogans.filter(x => !demoIds.slogans.has(x.id));
    if (Array.isArray(data.copy.copy))    data.copy.copy    = data.copy.copy.filter(x => !demoIds.copy.has(x.id));
    if (Array.isArray(data.copy.mascot))  data.copy.mascot  = data.copy.mascot.filter(x => !demoIds.mascot.has(x.id));
  }
  data.demoDataPurged_v1 = true;
  saveData();
  console.log('[seeding-hub] 已清理首版 demo 数据');
}

/* 拉取后端 webhook 收到的真实 KOL 资料，合并进本地（按"小红书号 → 博主ID → 昵称"优先级匹配） */
async function pullRemoteKols() {
  try {
    const resp = await fetch('/api/seeding/kols', { headers: { 'Accept': 'application/json' } });
    if (!resp.ok) { console.warn('[seeding-hub] /api/seeding/kols 不可用：', resp.status); return; }
    const remote = await resp.json();
    if (!Array.isArray(remote) || !remote.length) return;

    let updated = 0, created = 0;
    remote.forEach(r => {
      // 候选匹配：红书号 / mongoId / 昵称（任一命中即更新）
      let local = null;
      if (r.redId) local = data.kols.find(k => k.redId === r.redId);
      if (!local && r.internalUserId) local = data.kols.find(k => k.internalUserId === r.internalUserId);
      if (!local && r.name) local = data.kols.find(k => k.name === r.name);

      const patch = {
        redId:          r.redId          || (local && local.redId)          || (r.name||''),
        internalUserId: r.internalUserId || (local && local.internalUserId) || '',
        name:           r.name           || (local && local.name)           || '',
        followers:      (r.followers != null) ? r.followers : (local ? local.followers : 0),
        likes:          (r.likes     != null) ? r.likes     : (local ? local.likes     : null),
        gender:         r.gender         || (local && local.gender)         || '',
        ipLocation:     r.ipLocation     || (local && local.ipLocation)     || '',
        city:           r.ipLocation     || (local && local.city)           || '',  // 复用 city 字段展示
        contact:        r.contact        || (local && local.contact)        || '',
        bio:            r.bio            || (local && local.bio)            || '',
        profileUrl:     r.profileUrl     || (local && local.profileUrl)     || '',
        pgyUrl:         r.pgyUrl         || (local && local.pgyUrl)         || '',
        avatarUrl:      r.avatarUrl      || (local && local.avatarUrl)      || '',
      };

      if (local) {
        // 真小红书号到了 → 顺手把所有引用占位 redId 的 seedings/notes/images 一起改掉
        const oldRedId = local.redId;
        Object.assign(local, patch);
        if (oldRedId && patch.redId && oldRedId !== patch.redId) {
          data.seedings.forEach(s => { if (s.kolRedId === oldRedId) s.kolRedId = patch.redId; });
          data.notes.forEach(n => { if (n.kolRedId === oldRedId) n.kolRedId = patch.redId; });
          if (Array.isArray(data.images)) data.images.forEach(im => { if (im.kolRedId === oldRedId) im.kolRedId = patch.redId; });
        }
        updated++;
      } else {
        data.kols.push(Object.assign({
          id: uid('k'),
          tier: '', type: '', wechat: '',
          cooperationStatus: '已合作',
          notes: r.bio || '',
          createdAt: Date.now()
        }, patch));
        created++;
      }
    });
    if (updated || created) {
      saveData();
      console.log(`[seeding-hub] 远程 KOL 同步：更新 ${updated}，新建 ${created}`);
      if (typeof render === 'function') render();
    }
  } catch (e) {
    console.warn('[seeding-hub] 拉远程 KOL 失败（可能是离线 / 后端没部署）：', e.message);
  }
}

function mergeJessicaAndEnrich_v1() {

  const matches = data.kols.filter(k => aliases.includes(k.redId) || aliases.includes(k.name));

  matches.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));

  const newRedId = RUINI_REAL.redId;

  // 把 primary 升级成真实数据
  Object.assign(primary, RUINI_REAL, {
    notes: RUINI_REAL.bio || primary.notes,
    cooperationStatus: primary.cooperationStatus || '已合作',
  });

  // 删掉重复的 KOL
  const dupeIds = new Set(dupes.map(k => k.id));
  data.kols = data.kols.filter(k => !dupeIds.has(k.id));

  // 把所有引用旧 redId 的 seedings/notes/images 改成新 redId
  data.seedings.forEach(s => { if (oldRedIds.includes(s.kolRedId)) s.kolRedId = newRedId; });
  data.notes.forEach(n    => { if (oldRedIds.includes(n.kolRedId)) n.kolRedId = newRedId; });
  if (Array.isArray(data.images)) data.images.forEach(im => { if (oldRedIds.includes(im.kolRedId)) im.kolRedId = newRedId; });

  // 同昵称的两个 seeding/笔记记录如果都来自不同 alias，合并 seeding
  const seedingKols = {};
  data.seedings = data.seedings.filter(s => {
    if (s.kolRedId !== newRedId) return true;
    if (seedingKols[newRedId]) {
      // 把素材数追加到已存在的那条 notes
      const existing = seedingKols[newRedId];
      existing.notes = (existing.notes || '') + (s.notes ? ' / ' + s.notes : '');
      return false;
    }
    seedingKols[newRedId] = s;
    return true;
  });

  data.ruiniMerged_v1 = true;
  saveData();
  console.log('[seeding-hub] Rreneeni + ruini 合并完成 → ruini1115（真实）');
}

function importMarchNotes_v1() {
  if (data.marchNotesImported_v1) return;

  // 1) 把"复盘表新增"的占位 KOL 加进来（去重：name 已存在就不加）
  const existingNames = new Set((data.kols||[]).map(k => k.name));
  let newKolCnt = 0;
  MARCH_NOTES_BUNDLE.newKols.forEach(k => {
    if (!existingNames.has(k.name)) {
      data.kols.push(k);
      existingNames.add(k.name);
      newKolCnt++;
    }
  });

  // 2) 把 34 条笔记加进来；kolName → 找现有 KOL 的 redId 作为 kolRedId
  data.notes = data.notes || [];
  const existingNoteIds = new Set(data.notes.map(n => n.id));
  let addedNotes = 0;
  MARCH_NOTES_BUNDLE.notes.forEach(rec => {
    if (existingNoteIds.has(rec.id)) return;
    const k = data.kols.find(x => x.name === rec.kolName);
    const note = {
      id: rec.id,
      seedingId: '',
      kolRedId: k ? k.redId : rec.kolName,  // 找不到 KOL 退回用 kolName 占位
      title: rec.title,
      noteUrl: rec.noteUrl,
      noteType: rec.noteType,
      products: rec.products,
      postDate: rec.postDate,
      exposure: rec.exposure,
      reads: rec.reads,
      likes: rec.likes,
      saves: rec.saves,
      comments: rec.comments,
      engagement: rec.engagement,
      conversion: rec.conversion,
      ctr: rec.ctr,
      cpc: rec.cpc,
      cpe: rec.cpe,
      performanceTags: rec.performanceTags,
      imageIds: rec.imageIds || [],
      source: rec.source,
    };
    data.notes.push(note);
    addedNotes++;
  });

  data.marchNotesImported_v1 = true;
  saveData();
  console.log('[seeding-hub] 复盘底表导入完成：新增 ' + newKolCnt + ' 位占位 KOL，' + addedNotes + ' 条笔记');
}

function enrichMarchKols_v2() {
  if (data.marchKolEnriched_v2) return;

  // 1) 先把 unacc 合并进 unaccc：把 unacc 的 seedings/notes/images 引用全部改成 unaccc
  const unaccKol  = data.kols.find(k => k.redId === 'unacc');
  const unacccKol = data.kols.find(k => k.redId === 'unaccc');
  if (unaccKol && unacccKol) {
    data.seedings.forEach(s => { if (s.kolRedId === 'unacc') s.kolRedId = 'unaccc'; });
    data.notes.forEach(n    => { if (n.kolRedId === 'unacc') n.kolRedId = 'unaccc'; });
    if (Array.isArray(data.images)) data.images.forEach(im => { if (im.kolRedId === 'unacc') im.kolRedId = 'unaccc'; });
    // 把多余 unacc seeding 合并到 unaccc seeding：直接删掉 unacc 那条 seeding（同昵称已合并就只保留一条）
    data.seedings = data.seedings.filter(s => s.id !== 's_mar_unacc');
    data.kols     = data.kols.filter(k => k.id !== unaccKol.id);
  }

  // 2) 按 localName（= 占位 redId == 昵称）精确匹配并补全
  let updated = 0;
  MARCH_KOL_ENRICHMENT.forEach(rec => {
    const local = data.kols.find(k => k.redId === rec.localName) || data.kols.find(k => k.name === rec.localName);
    if (!local) { console.warn('[enrich] 未找到本地 KOL:', rec.localName); return; }
    const oldRedId = local.redId;
    const newRedId = rec.redId || oldRedId;
    Object.assign(local, {
      redId: newRedId,
      internalUserId: rec.internalUserId,
      name: rec.name,
      followers: rec.followers,
      likes: rec.likes,
      gender: rec.gender,
      ipLocation: rec.ipLocation,
      city: rec.ipLocation,        // 复用 city 字段在表格里展示
      contact: rec.contact,
      bio: rec.bio,
      notes: rec.bio || local.notes,  // 备注栏放简介更直观
      profileUrl: rec.profileUrl,
      pgyUrl: rec.pgyUrl,
      avatarUrl: rec.avatarUrl,
    });
    // 占位 redId 改成真号，级联更新 seedings/notes/images
    if (oldRedId !== newRedId) {
      data.seedings.forEach(s => { if (s.kolRedId === oldRedId) s.kolRedId = newRedId; });
      data.notes.forEach(n    => { if (n.kolRedId === oldRedId) n.kolRedId = newRedId; });
      if (Array.isArray(data.images)) data.images.forEach(im => { if (im.kolRedId === oldRedId) im.kolRedId = newRedId; });
    }
    updated++;
  });

  data.marchKolEnriched_v2 = true;
  saveData();
  console.log('[seeding-hub] 已补全 ' + updated + ' 位博主真实资料');
}

function mergeMarchSeed() {
  if (data.marchSeedImported_v1) return;
  data.kols     = data.kols     || [];
  data.seedings = data.seedings || [];
  data.images   = data.images   || [];

  const kolByRed = new Set(data.kols.map(k => k.redId));
  MARCH_SEED.kols.forEach(k => { if (!kolByRed.has(k.redId)) data.kols.push(k); });

  const seedKey = new Set(data.seedings.map(s => s.id));
  MARCH_SEED.seedings.forEach(s => { if (!seedKey.has(s.id)) data.seedings.push(s); });

  const imgKey = new Set(data.images.map(i => i.id));
  MARCH_SEED.images.forEach(i => { if (!imgKey.has(i.id)) data.images.push(i); });

  data.marchSeedImported_v1 = true;
  saveData();
  console.log('[seeding-hub] 已合并 3 月博主素材：', MARCH_SEED.kols.length, 'KOL /', MARCH_SEED.images.length, '素材');
}



function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      // 字段补全（避免老数据缺字段）
      return Object.assign(JSON.parse(JSON.stringify(defaultData)), parsed);
    }
  } catch(e) { console.error('load failed', e); }
  return JSON.parse(JSON.stringify(defaultData));
}
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    toast('保存失败：本地存储已满', 'error');
  }
}

/* ----- 文件名解析 ----- */
function parseFilename(name) {
  let stem = name.replace(/\.[^.]+$/, ''); // 去扩展名
  stem = stem.replace(/[\s\d]+$/, ''); // 去末尾数字+空格
  let blogger = '';
  let tags = [];
  // @博主-类目:类目:类目  或  博主-类目
  const m = stem.match(/^@?\s*([^\-－]+?)\s*[-－]\s*(.+)$/);
  if (m) {
    blogger = m[1].trim();
    const rest = m[2].trim();
    tags = rest.split(/[:：\/／、，,]/).map(s => s.trim()).filter(Boolean);
  } else {
    // 没有破折号，整个当博主名
    blogger = stem.replace(/^@/, '').trim();
  }
  return { blogger, tags };
}

/* ----- 导入处理 ----- */
async function handleTaggerImport(fileList) {
  const files = Array.from(fileList).filter(f => /\.(jpg|jpeg|png|gif|webp|mov|mp4|webm)$/i.test(f.name));
  if (!files.length) { toast('没有可识别的图片/视频', 'error'); return; }

  if (!taggerSession) {
    taggerSession = { items: [], idx: 0, mode: 'quick', selectedIds: new Set() };
  }

  toast(`正在处理 ${files.length} 个文件...`);
  let i = 0;
  for (const file of files) {
    const dataUrl = await readFileAsThumbnail(file);
    const { blogger, tags } = parseFilename(file.name);
    // 自动收集到标签库的建议标签
    const suggestedTags = tags;
    taggerSession.items.push({
      name: file.name,
      dataUrl,
      blogger,
      suggestedTags,
      tags: [], // 用户确认后填入
      performanceTags: [],
      idx: taggerSession.items.length,
      saved: false
    });
    i++;
    if (i % 20 === 0) {
      // 让 UI 喘口气
      await new Promise(r => setTimeout(r, 0));
    }
  }
  toast(`已导入 ${files.length} 个素材`, 'success');
  render();
}

async function readFileAsThumbnail(file) {
  // 视频不生成缩略图，只占位
  if (/\.(mov|mp4|webm)$/i.test(file.name)) {
    return ''; // 占位
  }
  const dataUrl = await fileToDataUrl(file);
  return await makeThumb(dataUrl, 800);
}

async function makeThumb(dataUrl, maxSize=800) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      try { res(canvas.toDataURL('image/jpeg', 0.82)); }
      catch(e) { res(dataUrl); }
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

function setupTaggerDrop() {
  const drop = document.getElementById('taggerDrop');
  if (!drop) return;
  ['dragenter','dragover','dragleave','drop'].forEach(ev => {
    drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
  });
  drop.addEventListener('dragover', () => drop.classList.add('dragover'));
  drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
  drop.addEventListener('drop', e => {
    drop.classList.remove('dragover');
    const items = e.dataTransfer.items;
    if (items && items[0] && items[0].webkitGetAsEntry) {
      // 递归读取文件夹
      const filesOut = [];
      const promises = [];
      for (const item of items) {
        const entry = item.webkitGetAsEntry();
        if (entry) promises.push(traverseEntry(entry, filesOut));
      }
      Promise.all(promises).then(() => handleTaggerImport(filesOut));
    } else {
      handleTaggerImport(e.dataTransfer.files);
    }
  });
}
function traverseEntry(entry, out) {
  return new Promise(res => {
    if (entry.isFile) {
      entry.file(f => { out.push(f); res(); });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const all = [];
      const readBatch = () => {
        reader.readEntries(entries => {
          if (!entries.length) {
            Promise.all(all).then(() => res());
          } else {
            entries.forEach(e => all.push(traverseEntry(e, out)));
            readBatch();
          }
        });
      };
      readBatch();
    } else res();
  });
}

let _quickKeyHandler = null;
function setupQuickKeyboard() {
  if (_quickKeyHandler) document.removeEventListener('keydown', _quickKeyHandler);
  _quickKeyHandler = (e) => {
    if (currentView !== 'tagger' || !taggerSession || taggerSession.mode !== 'quick') return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); taggerPrev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); taggerNext(); }

}

  else taggerSession.selectedIds.add(i);

}

  render();

function batchSelectByPattern() {
  const p = prompt('输入文件名包含的关键词（如博主名 "杰西卡" 或类目 "Grid"）：');

function batchToggleTag(tag, forceAdd) {
  if (!taggerSession.selectedIds || !taggerSession.selectedIds.size) {
    toast('先选择素材', 'error'); return;
  }
  const ids = Array.from(taggerSession.selectedIds);
  // 检测：是不是所有选中项都已经有这个 tag？是的话整体移除，否则整体加
  const allHave = !forceAdd && ids.every(i => taggerSession.items[i].tags.includes(tag));
  ids.forEach(i => {
    const it = taggerSession.items[i];
    if (allHave) {
      it.tags = it.tags.filter(t => t !== tag);
    } else {
      if (!it.tags.includes(tag)) it.tags.push(tag);
    }
  });
  toast(`${allHave?'已从':'已加到'} ${ids.length} 张`, 'success');
  render();
}

        ${viewToggleBtn('列表', 'list')}${viewToggleBtn('卡片', 'cards')}
      </div>
      <div style="margin-left: auto;">
        <button class="btn btn-primary btn-sm" onclick="openKolModal()">+ 录入 KOL</button>
      </div>
    </div>

    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">共 ${list.length} 位 KOL · 点博主名进详情页 · 同名（不去重）按小红书 ID 区分</div>

    ${list.length ? (kolFilter.view === 'cards' ? renderKolCards(list, nameMap) : renderKolTable(list, nameMap))
                  : '<div class="empty-state"><div class="icon">◐</div>没有匹配的 KOL</div>'}
  `;
}

function renderKolTable(list, nameMap) {
  return `
    <div class="card" style="padding: 0;">
      <table class="table">
        <thead>
          <tr>
            <th>昵称</th><th>小红书 ID</th><th>粉丝</th><th>体量</th><th>类型</th><th>城市</th><th>合作状态</th><th>合作次数</th><th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(k => `
            <tr>
              <td>
                <div style="display:flex;align-items:center;gap:8px;">
                  ${k.avatarUrl
                    ? `<img src="${escape(k.avatarUrl)}" referrerpolicy="no-referrer" style="width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border);" onerror="this.style.display='none'">`
                    : `<div style="width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;">${escape((k.name||'?').slice(0,1))}</div>`}
                  <div style="min-width:0;">
                    <strong style="cursor:pointer;color:var(--info);" onclick="setKolView('detail','${k.id}')">${escape(k.name)}</strong>
                    ${nameMap[k.name]>1?`<span class="tag" style="background:#FFF3E0;color:#B8550B;font-size:10px;margin-left:4px;">同名 ×${nameMap[k.name]}</span>`:''}
                    ${(k.profileUrl||k.pgyUrl) ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">
                      ${k.profileUrl?`<a href="${escape(k.profileUrl)}" target="_blank" rel="noopener" style="color:var(--info);text-decoration:none;margin-right:8px;">小红书 ↗</a>`:''}
                      ${k.pgyUrl?`<a href="${escape(k.pgyUrl)}" target="_blank" rel="noopener" style="color:var(--info);text-decoration:none;">蒲公英 ↗</a>`:''}
                    </div>`:''}
                  </div>
                </div>
              </td>
              <td>${fmtRedId(k.redId, k.name)}</td>
              <td>${formatNum(k.followers)}${k.likes?`<div style="font-size:11px;color:var(--text-muted);">赞藏 ${formatNum(k.likes)}</div>`:''}</td>
              <td><span class="tag">${k.tier||'-'}</span></td>
              <td><span class="tag blogger">${k.type||'-'}</span></td>
              <td>${escape(k.city||'-')}</td>
              <td>${escape(k.cooperationStatus||'-')}</td>
              <td>${data.seedings.filter(s=>s.kolRedId===k.redId).length}</td>
              <td class="actions">
                <button class="btn btn-sm btn-secondary" onclick="setKolView('detail','${k.id}')">详情</button>
                <button class="btn btn-sm btn-secondary btn-edit" onclick="openKolModal('${k.id}')">编辑</button>
                <button class="btn btn-sm btn-danger btn-delete" onclick="deleteKol('${k.id}')">删除</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderKolCards(list, nameMap) {
  return `
    <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:16px;">
      ${list.map(k => {
        const seedings = data.seedings.filter(s => s.kolRedId === k.redId);
        const notes = data.notes.filter(n => n.kolRedId === k.redId).sort((a,b)=>(b.postDate||0)-(a.postDate||0));
        const imgs = (data.images||[]).filter(im => im.kolRedId === k.redId);
        const totalExposure = notes.reduce((s,n)=>s+(n.exposure||0),0);
        const totalEng = notes.reduce((s,n)=>s+(n.engagement||0),0);
        return `
          <div class="card" style="padding:0;cursor:pointer;transition:box-shadow 0.15s, transform 0.15s;"
               onmouseover="this.style.boxShadow='var(--shadow-md)';this.style.transform='translateY(-2px)';"
               onmouseout="this.style.boxShadow='';this.style.transform='';"
               onclick="setKolView('detail','${k.id}')">
            <div style="padding:16px;display:flex;gap:12px;align-items:flex-start;">
              ${k.avatarUrl
                ? `<img src="${escape(k.avatarUrl)}" referrerpolicy="no-referrer" style="width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border);" onerror="this.style.display='none'">`
                : `<div style="width:56px;height:56px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;font-weight:600;">${escape((k.name||'?').slice(0,1))}</div>`}
              <div style="flex:1;min-width:0;">
                <div style="font-weight:600;font-size:15px;margin-bottom:2px;">${escape(k.name)}${nameMap[k.name]>1?` <span class="tag" style="background:#FFF3E0;color:#B8550B;font-size:10px;">×${nameMap[k.name]}</span>`:''}</div>
                <div style="font-size:11px;color:var(--text-muted);">${fmtRedId(k.redId, k.name)}</div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">
                  ${k.ipLocation || k.city ? `📍 ${escape(k.ipLocation || k.city)}` : ''}
                  ${k.gender ? ` · ${escape(k.gender)}` : ''}
                </div>
              </div>
            </div>
            ${k.bio ? `<div style="padding:0 16px 12px;font-size:12px;color:var(--text-secondary);line-height:1.5;max-height:48px;overflow:hidden;">${escape(k.bio.split('\\n')[0])}</div>` : ''}
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border);">
              <div style="padding:8px;background:white;text-align:center;">
                <div style="font-weight:600;font-size:14px;">${formatNum(k.followers)}</div>
                <div style="font-size:11px;color:var(--text-muted);">粉丝</div>
              </div>
              <div style="padding:8px;background:white;text-align:center;">
                <div style="font-weight:600;font-size:14px;">${imgs.length}</div>
                <div style="font-size:11px;color:var(--text-muted);">素材</div>
              </div>
              <div style="padding:8px;background:white;text-align:center;">
                <div style="font-weight:600;font-size:14px;">${notes.length}</div>
                <div style="font-size:11px;color:var(--text-muted);">笔记</div>
              </div>
            </div>
            ${notes.length ? `
              <div style="border-top:1px solid var(--border);padding:10px 16px;background:#FAFBFC;">
                <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">最近笔记 · 总曝光 ${formatNum(totalExposure)}</div>
                ${notes.slice(0,2).map(n => `
                  <div style="font-size:12px;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;">
                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escape(n.title)}">${n.noteType?`<span style="color:${n.noteType==='视频'?'#B8550B':'#1565C0'};font-size:10px;margin-right:4px;">[${escape(n.noteType)}]</span>`:''}${escape(n.title)}</span>
                    <span style="color:var(--text-muted);flex-shrink:0;">${formatNum(n.exposure)}曝</span>
                  </div>
                `).join('')}
              </div>` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderKolDetail(root, kolId) {
  const k = data.kols.find(x => x.id === kolId);
  if (!k) {
    root.innerHTML = `<button class="btn btn-secondary btn-sm" onclick="setKolView('list')">← 返回 KOL 库</button>
      <div class="empty-state"><div class="icon">○</div>KOL 不存在或已被删除</div>`;
    return;
  }
  const seedings = data.seedings.filter(s => s.kolRedId === k.redId).sort((a,b)=>(b.shipDate||0)-(a.shipDate||0));
  const notes = data.notes.filter(n => n.kolRedId === k.redId).sort((a,b)=>(b.postDate||0)-(a.postDate||0));
  const imgs = (data.images||[]).filter(im => im.kolRedId === k.redId);
  const totalExposure = notes.reduce((s,n)=>s+(n.exposure||0),0);
  const totalEng      = notes.reduce((s,n)=>s+(n.engagement||0),0);
  const avgCtr        = notes.filter(n=>n.ctr!=null).reduce((a,n,_,arr)=>a+n.ctr/arr.length,0);

  root.innerHTML = `
    <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;">
      <button class="btn btn-secondary btn-sm" onclick="setKolView('list')">← 返回 KOL 库</button>
      <button class="btn btn-secondary btn-sm" onclick="openKolModal('${k.id}')">编辑资料</button>
    </div>

    <div class="card" style="display:flex;gap:20px;align-items:flex-start;">
      ${k.avatarUrl
        ? `<img src="${escape(k.avatarUrl)}" referrerpolicy="no-referrer" style="width:96px;height:96px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border);" onerror="this.style.display='none'">`
        : `<div style="width:96px;height:96px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;font-weight:600;">${escape((k.name||'?').slice(0,1))}</div>`}
      <div style="flex:1;min-width:0;">
        <div style="font-size:22px;font-weight:600;margin-bottom:4px;">${escape(k.name)}</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">
          小红书号 ${fmtRedId(k.redId, k.name)}
          ${k.gender ? ` · ${escape(k.gender)}` : ''}
          ${k.ipLocation || k.city ? ` · 📍 ${escape(k.ipLocation || k.city)}` : ''}
        </div>
        ${k.bio ? `<div style="font-size:13px;line-height:1.6;color:var(--text-secondary);margin-bottom:8px;white-space:pre-wrap;">${escape(k.bio)}</div>` : ''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;">
          ${k.profileUrl?`<a href="${escape(k.profileUrl)}" target="_blank" rel="noopener" class="btn btn-sm btn-secondary">小红书主页 ↗</a>`:''}
          ${k.pgyUrl?`<a href="${escape(k.pgyUrl)}" target="_blank" rel="noopener" class="btn btn-sm btn-secondary">蒲公英 ↗</a>`:''}
          ${k.contact?`<span style="padding:6px 10px;border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);">📧 ${escape(k.contact)}</span>`:''}
          ${k.wechat?`<span style="padding:6px 10px;border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);">微信 ${escape(k.wechat)}</span>`:''}
        </div>
      </div>
    </div>

    <div class="stat-grid" style="margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
      <div class="stat-card"><div class="stat-label">粉丝数</div><div class="stat-value">${formatNum(k.followers)}</div>${k.likes?`<div class="stat-trend">赞藏 ${formatNum(k.likes)}</div>`:''}</div>
      <div class="stat-card"><div class="stat-label">Seeding 场次</div><div class="stat-value">${seedings.length}</div></div>
      <div class="stat-card"><div class="stat-label">已发笔记</div><div class="stat-value">${notes.length}</div><div class="stat-trend">${notes.filter(n=>n.noteType==='视频').length}视频/${notes.filter(n=>n.noteType==='图文').length}图文</div></div>
      <div class="stat-card"><div class="stat-label">3月素材</div><div class="stat-value">${imgs.length}</div></div>
      <div class="stat-card"><div class="stat-label">总曝光</div><div class="stat-value">${formatNum(totalExposure)}</div><div class="stat-trend">总互动 ${formatNum(totalEng)}</div></div>
      ${avgCtr ? `<div class="stat-card"><div class="stat-label">平均点击率</div><div class="stat-value">${(avgCtr*100).toFixed(1)}%</div></div>` : ''}
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-title">Seeding 记录（${seedings.length}）</div>
      ${seedings.length ? `
        <table class="table" style="font-size:13px;">
          <thead><tr><th>SKU 列表</th><th>寄送日期</th><th>寄送状态</th><th>工作流</th><th>笔记</th><th>成本</th><th>备注</th></tr></thead>
          <tbody>
            ${seedings.map(s => `
              <tr>
                <td>${escape(s.skuList||'-')}</td>
                <td>${fmtDate(s.shipDate)}</td>
                <td>${renderShipStatusSelect(s)}</td>
                <td>${renderWorkflowCell(s)}</td>
                <td>${data.notes.filter(n=>n.seedingId===s.id).length}</td>
                <td>¥${formatNum(s.cost||0)}</td>
                <td style="color:var(--text-muted);font-size:12px;">${escape(s.notes||'-')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>` : '<div style="color:var(--text-muted);text-align:center;padding:24px;">暂无 Seeding 记录</div>'}

    <div class="card" style="margin-top:16px;">
      <div class="card-title">已发笔记（${notes.length}）</div>

          <thead><tr><th>标题</th><th>类型</th><th>产品</th><th>发布日</th><th>曝光</th><th>互动</th><th>CTR</th><th>表现</th></tr></thead>
          <tbody>
            ${notes.map(n => `
              <tr>
                <td style="max-width:280px;">
                  ${n.noteUrl?`<a href="${escape(n.noteUrl)}" target="_blank" style="color:var(--info);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escape(n.title)}">${escape(n.title)}</a>`:`<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escape(n.title)}">${escape(n.title)}</div>`}
                </td>
                <td>${n.noteType?`<span class="tag" style="background:${n.noteType==='视频'?'#FFF3E0':'#E3F2FD'};color:${n.noteType==='视频'?'#B8550B':'#1565C0'};">${escape(n.noteType)}</span>`:'-'}</td>
                <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text-secondary);" title="${escape(n.products||'')}">${escape(n.products||'-')}</td>
                <td>${fmtDate(n.postDate)}</td>
                <td>${formatNum(n.exposure)}</td>
                <td>${formatNum(n.engagement)}</td>
                <td>${n.ctr!=null?(n.ctr*100).toFixed(1)+'%':'-'}</td>
                <td>${(n.performanceTags||[]).map(t=>renderNoteTag(t)).join(' ')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>` : '<div style="color:var(--text-muted);text-align:center;padding:24px;">暂无笔记</div>'}
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-title">3月素材（${imgs.length}）</div>
      ${imgs.length ? `
        <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:8px;">
          ${imgs.map(im => `
            <div style="aspect-ratio:1;background:#f5f5f5;border-radius:6px;overflow:hidden;position:relative;">
              ${im.isVideo
                ? `<video src="${escape(im.dataUrl)}" style="width:100%;height:100%;object-fit:cover;" preload="metadata"></video>
                   <div style="position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.6);color:white;padding:2px 6px;border-radius:3px;font-size:11px;">▶ 视频</div>`
                : `<img src="${escape(im.dataUrl)}" loading="lazy" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentNode.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:24px;color:#999;\\'>${escape(im.emoji||'📷')}</div>'">`}
              <div style="position:absolute;top:4px;left:4px;background:rgba(0,0,0,0.6);color:white;padding:2px 6px;border-radius:3px;font-size:10px;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escape((im.title||'').replace(/^@.+? · /,''))}</div>
            </div>
          `).join('')}
        </div>` : '<div style="color:var(--text-muted);text-align:center;padding:24px;">暂无素材</div>'}
    </div>
  `;
}
function openKolModal(id) {
  if (!requireEdit()) return;
  const k = id ? data.kols.find(x => x.id === id) : { redId:'', name:'', followers:0, type:'', tier:'', contact:'', wechat:'', city:'', cooperationStatus:'未联系', notes:'' };
  if (!k) return;
  showModal(id ? '编辑 KOL' : '录入 KOL', `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="form-group">
        <label class="form-label">博主昵称 *</label>
        <input class="input" id="kolName" value="${escape(k.name)}">
        <div class="form-hint">允许同名（不去重）</div>
      </div>
      <div class="form-group">
        <label class="form-label">小红书 ID * (唯一)</label>
        <input class="input" id="kolRedId" value="${(k.redId && k.redId !== k.name) ? escape(k.redId) : ''}" placeholder="${(k.redId && k.redId !== k.name) ? '' : '例如 xhs8821'}" ${(id && k.redId && k.redId !== k.name) ? 'disabled' : ''}>
        <div class="form-hint">${(id && k.redId && k.redId !== k.name) ? '已确认的 ID 不能修改' : (id ? '当前是占位（用昵称替代），填入真实 ID 后会自动同步到 Seeding/笔记记录' : '作为唯一身份标识')}</div>
      </div>
      <div class="form-group">
        <label class="form-label">粉丝数</label>
        <input type="number" class="input" id="kolFollowers" value="${k.followers||0}">
      </div>
      <div class="form-group">
        <label class="form-label">体量</label>
        <select class="select" id="kolTier">
          <option value="">-</option>
          <option ${k.tier==='头部'?'selected':''}>头部</option>
          <option ${k.tier==='腰部'?'selected':''}>腰部</option>
          <option ${k.tier==='尾部'?'selected':''}>尾部</option>
          <option ${k.tier==='素人'?'selected':''}>素人</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">博主类型</label>
        <select class="select" id="kolType">
          <option value="">-</option>
          ${data.tags.blogger.map(t=>`<option ${k.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">城市</label>
        <input class="input" id="kolCity" value="${escape(k.city||'')}">
      </div>
      <div class="form-group">
        <label class="form-label">联系方式 (邮箱/手机)</label>
        <input class="input" id="kolContact" value="${escape(k.contact||'')}">
      </div>
      <div class="form-group">
        <label class="form-label">微信</label>
        <input class="input" id="kolWechat" value="${escape(k.wechat||'')}">
      </div>
      <div class="form-group">
        <label class="form-label">合作状态</label>
        <select class="select" id="kolCoop">
          <option ${k.cooperationStatus==='未联系'?'selected':''}>未联系</option>
          <option ${k.cooperationStatus==='意向中'?'selected':''}>意向中</option>
          <option ${k.cooperationStatus==='已合作'?'selected':''}>已合作</option>
          <option ${k.cooperationStatus==='已拒绝'?'selected':''}>已拒绝</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <textarea class="textarea" id="kolNotes">${escape(k.notes||'')}</textarea>
    </div>
  `, () => {
    const redId = document.getElementById('kolRedId').value.trim();
    const name = document.getElementById('kolName').value.trim();
    if (!redId || !name) { toast('昵称与小红书 ID 必填', 'error'); return false; }
    // 新增 / 改 redId 时都要查重（同一个 KOL 自身不算）
    if (data.kols.some(x => x.redId === redId && x.id !== (id||''))) { toast('此小红书 ID 已存在', 'error'); return false; }
    const oldRedId = id ? k.redId : null;
    const updated = {
      redId, name,
      followers: Number(document.getElementById('kolFollowers').value)||0,
      tier: document.getElementById('kolTier').value,
      type: document.getElementById('kolType').value,
      city: document.getElementById('kolCity').value.trim(),
      contact: document.getElementById('kolContact').value.trim(),
      wechat: document.getElementById('kolWechat').value.trim(),
      cooperationStatus: document.getElementById('kolCoop').value,
      notes: document.getElementById('kolNotes').value.trim()
    };
    if (id) {
      Object.assign(k, updated);
      // 占位 redId 改成真实 ID 时，把所有相关记录的引用一起改掉
      if (oldRedId && oldRedId !== redId) {
        data.seedings.forEach(s => { if (s.kolRedId === oldRedId) s.kolRedId = redId; });
        data.notes.forEach(n => { if (n.kolRedId === oldRedId) n.kolRedId = redId; });
        if (Array.isArray(data.images)) data.images.forEach(im => { if (im.kolRedId === oldRedId) im.kolRedId = redId; });
      }
    } else {
      data.kols.push(Object.assign({ id: uid('k'), createdAt: Date.now() }, updated));
    }
    saveData(); renderKols(document.getElementById('content'));
    toast('已保存', 'success');
    return true;
  });
}
function deleteKol(id) {
  if (!requireDelete()) return;
  if (!confirm('确认删除该 KOL？关联的 Seeding 与笔记不会被删除。')) return;
  data.kols = data.kols.filter(k => k.id !== id);
  saveData(); renderKols(document.getElementById('content')); toast('已删除', 'success');
}

/* ==================================================================
   Seeding
   ================================================================== */
let seedingFilter = { search: '', deliveryStatus: '' };
function renderSeedings(root) {
  let list = data.seedings.filter(s => {
    if (seedingFilter.search) {
      const q = seedingFilter.search.toLowerCase();
      const kn = kolName(s.kolRedId).toLowerCase();
      if (!kn.includes(q) && !s.kolRedId.toLowerCase().includes(q) && !s.skuList.toLowerCase().includes(q)) return false;
    }
    if (seedingFilter.deliveryStatus && s.deliveryStatus !== seedingFilter.deliveryStatus) return false;
    return true;
  }).sort((a,b)=>b.createdAt-a.createdAt);

  root.innerHTML = `
    <div class="filter-bar">
      <input class="input" style="width:240px;" placeholder="搜索博主 / SKU..." value="${seedingFilter.search}" oninput="seedingFilter.search=this.value; renderSeedings(document.getElementById('content'))">
      <select class="select" style="width:120px;" onchange="seedingFilter.deliveryStatus=this.value; renderSeedings(document.getElementById('content'))">
        <option value="">全部状态</option>
        <option ${seedingFilter.deliveryStatus==='待寄送'?'selected':''}>待寄送</option>
        <option ${seedingFilter.deliveryStatus==='运输中'?'selected':''}>运输中</option>
        <option ${seedingFilter.deliveryStatus==='已签收'?'selected':''}>已签收</option>
        <option ${seedingFilter.deliveryStatus==='退回'?'selected':''}>退回</option>
      </select>
      <div style="margin-left:auto;"><button class="btn btn-primary btn-sm" onclick="openSeedingModal()">+ 新增 Seeding</button></div>
    </div>

    <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">共 ${list.length} 条 · 总成本 ¥${formatNum(list.reduce((s,k)=>s+(Number(k.cost)||0),0))}</div>

    <div class="card" style="padding:0;">
      <table class="table">
        <thead>
          <tr>
            <th>博主</th><th>小红书 ID</th><th>SKU 列表</th><th>寄送日期</th><th>寄送状态</th><th>工作流</th><th>笔记</th><th>成本</th><th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${list.length ? list.map(s => {
            const kolObj = data.kols.find(x => x.redId === s.kolRedId);
            const noteCount = data.notes.filter(n=>n.seedingId===s.id).length;
            return `
            <tr>
              <td>${kolObj
                ? `<a href="javascript:void(0)" onclick="setNavView('kols');setKolView('detail','${kolObj.id}');" style="color:var(--info);text-decoration:none;font-weight:500;">${escape(kolObj.name)} ↗</a>`
                : escape(kolName(s.kolRedId))}</td>
              <td>${fmtRedId(s.kolRedId, kolName(s.kolRedId))}</td>
              <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escape(s.skuList||'')}">${escape(s.skuList)}</td>
              <td>${fmtDate(s.shipDate)}</td>
              <td>${renderShipStatusSelect(s)}</td>
              <td>${renderWorkflowCell(s)}</td>
              <td>${noteCount
                ? `<a href="javascript:void(0)" onclick="jumpToNotesBySeeding('${s.id}')" style="color:var(--info);text-decoration:none;">${noteCount} 篇 ↗</a>`
                : '<span style="color:var(--text-muted);">0</span>'}</td>
              <td>¥${formatNum(s.cost||0)}</td>
              <td class="actions">
                <button class="btn btn-sm btn-secondary btn-edit" onclick="openSeedingModal('${s.id}')">编辑</button>
                <button class="btn btn-sm btn-danger btn-delete" onclick="deleteSeeding('${s.id}')">删除</button>
              </td>
            </tr>`;
          }).join('') : '<tr><td colspan="9" class="empty-state"><div class="icon">▶</div>暂无记录</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
function renderShipStatus(s) {
  const cls = s==='已签收'?'shipped':(s==='待寄送'?'pending':'delivered');
  return `<span class="tag ${cls}">${s||'-'}</span>`;
}

/* ======================================================================
   Seeding 工作流：8 阶段 + 反馈记录
   ====================================================================== */
const WORKFLOW_STAGES = [
  {key: '沟通中',     color: '#646A73', progress: 5,   desc: '与博主谈合作'},
  {key: '创作中',     color: '#6840C7', progress: 40,  desc: '博主已收到，正在创作'},
  {key: '文案审核',   color: '#FF8800', progress: 55,  desc: '审核博主文案'},
  {key: '图片审核',   color: '#FF8800', progress: 70,  desc: '审核博主图片'},
  {key: '视频审核',   color: '#FF8800', progress: 80,  desc: '审核博主视频'},
  {key: '待发布',     color: '#7AC74F', progress: 90,  desc: '审核通过待发布'},
  {key: '已发布',     color: '#34C724', progress: 100, desc: '笔记已上线'},
  {key: '已结束',     color: '#999999', progress: 100, desc: '终止/不发布'},
];
const FEEDBACK_TYPES = [
  {key: '需修改', color: '#FF8800'},
  {key: '已通过', color: '#34C724'},
  {key: '建议',   color: '#3370FF'},
  {key: '其他',   color: '#646A73'},
];

/* 一次性：根据现有 deliveryStatus / 笔记 推断初始 workflowStage */
function migrateWorkflowStage_v1() {
  if (data.workflowStageMigrated_v1) return;
  data.seedings = data.seedings || [];
  data.seedings.forEach(s => {
    if (s.workflowStage) return;
    const hasNote = (data.notes||[]).some(n => n.seedingId === s.id);
    if (hasNote)                              s.workflowStage = '已发布';
    else if (s.deliveryStatus === '已签收')   s.workflowStage = '创作中';
    else if (s.deliveryStatus === '退回')     s.workflowStage = '已结束';
    else                                      s.workflowStage = '沟通中';
    s.feedback = s.feedback || [];
  });
  data.workflowStageMigrated_v1 = true;
  saveData();
}

/* Seeding 表的工作流单元格：阶段 tag + 进度条 + 反馈数 */
function renderWorkflowCell(s) {
  const stage = s.workflowStage || '沟通中';
  const info = WORKFLOW_STAGES.find(x => x.key === stage) || WORKFLOW_STAGES[0];
  const fbCount = (s.feedback||[]).length;
  return `
    <div style="cursor:pointer;min-width:120px;" onclick="openWorkflowModal('${s.id}')" title="点击查看 / 修改工作流">
      <div style="display:flex;align-items:center;gap:4px;margin-bottom:3px;">
        <span class="tag" style="background:${info.color}15;color:${info.color};border:1px solid ${info.color}40;font-size:11px;padding:2px 8px;">${stage}</span>
        ${fbCount?`<span style="font-size:11px;color:var(--text-muted);">💬${fbCount}</span>`:''}
      </div>
      <div style="height:3px;background:var(--border);border-radius:2px;overflow:hidden;">
        <div style="width:${info.progress}%;height:100%;background:${info.color};transition:width 0.3s;"></div>
      </div>
    </div>
  `;
}

function updateWorkflowStage(seedingId, newStage) {
  if (!requireEdit()) return;
  const s = data.seedings.find(x => x.id === seedingId);
  if (!s) return;
  s.workflowStage = newStage;
  saveData();
  toast(`工作流：→ ${newStage}`, 'success');
  openWorkflowModal(seedingId);  // 重渲 modal
  // 同时刷新背景列表
  if (currentView === 'seedings') renderSeedings(document.getElementById('content'));
  if (currentView === 'kols' && kolFilter.view === 'detail') renderKols(document.getElementById('content'));
}

function addWorkflowFeedback(seedingId) {
  if (!requireEdit()) return;
  const type = document.getElementById('fbType').value;
  const content = document.getElementById('fbContent').value.trim();
  if (!content) { toast('反馈内容不能为空', 'error'); return; }
  const s = data.seedings.find(x => x.id === seedingId);
  if (!s) return;
  s.feedback = s.feedback || [];
  s.feedback.push({
    id: uid('fb'),
    ts: Date.now(),
    author: role().name,
    type, content,
  });
  saveData();
  toast('已记录反馈', 'success');
  openWorkflowModal(seedingId);
  if (currentView === 'seedings') renderSeedings(document.getElementById('content'));
  if (currentView === 'kols' && kolFilter.view === 'detail') renderKols(document.getElementById('content'));
}

function deleteWorkflowFeedback(seedingId, fbId) {
  if (!requireDelete()) return;
  if (!confirm('确认删除这条反馈？')) return;
  const s = data.seedings.find(x => x.id === seedingId);
  if (!s || !Array.isArray(s.feedback)) return;
  s.feedback = s.feedback.filter(f => f.id !== fbId);
  saveData();
  openWorkflowModal(seedingId);
}

function openWorkflowModal(seedingId) {
  const s = data.seedings.find(x => x.id === seedingId);
  if (!s) return;
  const k = data.kols.find(x => x.redId === s.kolRedId);
  const stage = s.workflowStage || '沟通中';
  const info = WORKFLOW_STAGES.find(x => x.key === stage) || WORKFLOW_STAGES[0];
  const fb = (s.feedback||[]).slice().sort((a,b) => b.ts - a.ts);

  const body = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px;">
      <div>
        ${k ? `<a href="javascript:void(0)" onclick="closeModal();setNavView('kols');setKolView('detail','${k.id}');" style="color:var(--info);text-decoration:none;font-weight:500;">${escape(k.name)} ↗</a>` : escape(s.kolRedId)}
        <span style="color:var(--text-muted);margin-left:8px;">${escape(s.skuList||'-')}</span>
      </div>
      <span style="color:var(--text-muted);">寄送日 ${fmtDate(s.shipDate)}</span>
    </div>
    <div style="height:6px;background:var(--border);border-radius:3px;margin-bottom:6px;overflow:hidden;">
      <div style="width:${info.progress}%;height:100%;background:${info.color};transition:width 0.3s;"></div>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:16px;">当前阶段：<strong style="color:${info.color}">${stage}</strong> · ${escape(info.desc)}</div>

    <div style="margin-bottom:8px;font-size:12px;color:var(--text-muted);">点击切换阶段：</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;">
      ${WORKFLOW_STAGES.map(st => {
        const active = st.key === stage;
        return `<button class="btn btn-sm" onclick="updateWorkflowStage('${seedingId}','${st.key}')"
          style="border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer;
                 ${active?`background:${st.color};color:white;border:1px solid ${st.color};font-weight:500;`:`background:white;color:var(--text-secondary);border:1px solid var(--border);`}">${st.key}</button>`;
      }).join('')}
    </div>

    <div style="border-top:1px solid var(--border);padding-top:16px;margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong style="font-size:14px;">📝 反馈意见</strong>
        <span style="font-size:11px;color:var(--text-muted);">共 ${fb.length} 条</span>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-start;">
        <select class="select" id="fbType" style="flex-shrink:0;width:100px;">
          ${FEEDBACK_TYPES.map(t => `<option value="${t.key}">${t.key}</option>`).join('')}
        </select>
        <textarea class="textarea" id="fbContent" rows="2" placeholder="记录沟通要点 / 修改要求 / 审核意见…" style="flex:1;resize:vertical;"></textarea>
        <button class="btn btn-primary btn-sm" onclick="addWorkflowFeedback('${seedingId}')" style="flex-shrink:0;">提交</button>
      </div>
    </div>

    <div style="max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;">
      ${fb.length ? fb.map(f => {
        const tInfo = FEEDBACK_TYPES.find(x => x.key === f.type) || FEEDBACK_TYPES[3];
        return `
          <div style="padding:10px 12px;border-bottom:1px solid var(--border);">
            <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:4px;">
              <div>
                <span class="tag" style="background:${tInfo.color}15;color:${tInfo.color};font-size:10px;padding:2px 6px;">${f.type}</span>
                <span style="margin-left:6px;">${escape(f.author||'-')}</span>
                <span style="margin-left:6px;">${new Date(f.ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
              </div>
              <button class="btn-delete" style="background:transparent;color:var(--danger);font-size:11px;padding:2px 6px;border:none;cursor:pointer;" onclick="deleteWorkflowFeedback('${seedingId}','${f.id}')">删</button>
            </div>
            <div style="font-size:13px;line-height:1.5;white-space:pre-wrap;">${escape(f.content)}</div>
          </div>
        `;
      }).join('') : '<div style="padding:24px;color:var(--text-muted);text-align:center;font-size:13px;">还没有反馈记录</div>'}
    </div>
  `;
  showModal('Seeding 工作流', body, null, []);
}

/* 跳转辅助：从 Seeding 笔记数列点击 → 跳到笔记表，按博主名搜索 */
function jumpToNotesBySeeding(seedingId) {
  const s = data.seedings.find(x => x.id === seedingId);
  if (!s) return;
  const k = data.kols.find(x => x.redId === s.kolRedId);
  noteFilter.search = k ? k.name : s.kolRedId;
  setNavView('notes');
}

/* 跳转辅助：从 modal 切换主导航视图 */
function setNavView(view) {
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.view === view);
  });
  currentView = view;
  render();
}
// 行内可改的下拉版（onchange 直接落库）

function renderCheckTab(root) {
  root.innerHTML = `

    if (banned.length) {

        </div>`;
    } else {
      out.innerHTML = `<div style="color:var(--success);font-weight:600;">✓ 未检测到极限词，文案可用</div>`;

  ta.addEventListener('input', update); update();
}
function checkBannedWords(text) {
  return data.copy.bannedWords.filter(w => text.includes(w.word)).map(w => w.word);
}
function highlightBanned(text) {
  let result = escape(text);
  data.copy.bannedWords.forEach(w => {
    result = result.replace(new RegExp(escapeRegex(w.word), 'g'), `<span class="banned-word">${w.word}</span>`);
  });
  return result;
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function renderAnalytics(root) {
  // 类型占比
  const typeCount = {};
  data.kols.forEach(k => typeCount[k.type||'未分类'] = (typeCount[k.type||'未分类']||0) + 1);

  // 体量占比
  const tierCount = {};
  data.kols.forEach(k => tierCount[k.tier||'未分类'] = (tierCount[k.tier||'未分类']||0) + 1);

  // Seeding 状态分布
  const statusCount = {};
  data.seedings.forEach(s => statusCount[s.deliveryStatus||'未知'] = (statusCount[s.deliveryStatus||'未知']||0) + 1);

  // 笔记表现标签分布
  const perfCount = { '高转化':0, '高溢出':0, '高曝光':0 };
  data.notes.forEach(n => (n.performanceTags||[]).forEach(t => {
    if (perfCount[t] !== undefined) perfCount[t]++;
  }));

  // 各 KOL ROI（简化：转化数 / 寄送成本）
  const kolRoi = data.kols.map(k => {
    const ks = data.seedings.filter(s => s.kolRedId === k.redId);
    const cost = ks.reduce((s, x) => s + (Number(x.cost)||0), 0);
    const ns = data.notes.filter(n => n.kolRedId === k.redId);
    const conv = ns.reduce((s, x) => s + (x.conversion||0), 0);
    const exposure = ns.reduce((s, x) => s + (x.exposure||0), 0);
    return { name: k.name, redId: k.redId, type: k.type, cost, conv, exposure, cpe: cost && conv ? cost/conv : null };
  }).filter(x => x.cost > 0).sort((a,b) => (a.cpe||999) - (b.cpe||999));

  root.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
      <div class="card">
        <div class="card-title">博主类型占比</div>
        ${renderBarChart(typeCount)}
      </div>
      <div class="card">
        <div class="card-title">博主体量占比</div>
        ${renderBarChart(tierCount)}
      </div>
      <div class="card">
        <div class="card-title">Seeding 状态分布</div>
        ${renderBarChart(statusCount)}
      </div>
      <div class="card">
        <div class="card-title">笔记表现标签分布</div>
        ${renderBarChart(perfCount)}
      </div>
    </div>

    <div class="card">
      <div class="card-title">KOL 投放效果 (按 CPE 升序)</div>
      <table class="table">

function renderBarChart(obj) {
  const entries = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,e)=>s+e[1],0);
  const max = Math.max(1, ...entries.map(e=>e[1]));
  if (!entries.length || total === 0) return '<div class="empty-state"><div class="icon">○</div>暂无数据</div>';
  return entries.map(([k,v]) => `
    <div class="bar-chart-row">
      <div class="label">${escape(k)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(v/max*100).toFixed(0)}%"></div></div>
      <div class="value">${v} (${(v/total*100).toFixed(0)}%)</div>
    </div>
  `).join('');
}

function addTag(cat) {
  if (!requireEdit()) return;
  const name = prompt('新标签名称：');
  if (!name) return;
  if (data.tags[cat].includes(name)) { toast('已存在', 'error'); return; }
  data.tags[cat].push(name);
  saveData(); renderTags(document.getElementById('content'));
}
function removeTag(cat, name) {
  if (!requireDelete()) return;
  if (!confirm(`确认删除标签 "${name}"？已使用此标签的内容不会被自动清除。`)) return;
  data.tags[cat] = data.tags[cat].filter(t => t !== name);

}

/* ==================================================================
   工具函数
   ================================================================== */
function kolName(redId) { const k = data.kols.find(x=>x.redId===redId); return k?k.name:'(未知)'; }
// 把 redId 在表格里渲染成 <code>xxx</code>；若 redId 缺失或就是昵称占位（说明真实小红书 ID 还没补），显示"待补充"
// 例外：博主真实小红书号刚好跟昵称相同（如 HolaBearXiong / Unasa811720），靠 internalUserId 判定是否真实
function fmtRedId(redId, name) {
  if (!redId) return '<span style="color:#B8550B;font-size:12px;">待补充</span>';
  if (redId === name) {
    const k = (data && data.kols) ? data.kols.find(x => x.redId === redId) : null;
    if (!k || !k.internalUserId) return '<span style="color:#B8550B;font-size:12px;">待补充</span>';
  }
  return '<code style="font-size:12px;">' + escape(redId) + '</code>';
}
function escape(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatNum(n) {
  n = Number(n)||0;
  if (n >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,'') + 'w';
  return n.toLocaleString();
}
function fmtDate(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateInputValue(ts) { if (!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  setTimeout(() => t.className = 'toast '+(type||''), 2400);
}

/* ==================================================================
   Modal
   ================================================================== */
let modalOnSubmit = null;
function showModal(title, body, onSubmit, customButtons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  const footer = document.getElementById('modalFooter');
  modalOnSubmit = onSubmit;
  if (customButtons) {
    footer.innerHTML = customButtons.filter(b => b.show !== false).map((b,i) => `
      <button class="btn ${b.class||'btn-secondary'}" data-idx="${i}">${b.label}</button>
    `).join('') + '<button class="btn btn-secondary" onclick="closeModal()">关闭</button>';
    footer.querySelectorAll('button[data-idx]').forEach((btn, i) => {
      const real = customButtons.filter(b => b.show !== false)[i];
      btn.onclick = real.action;
    });
  } else {
    footer.innerHTML = `
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitModal()">保存</button>
    `;
  }
  document.getElementById('modal').classList.add('active');
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
  modalOnSubmit = null;
}
async function submitModal() {
  if (!modalOnSubmit) { closeModal(); return; }
  const ok = await modalOnSubmit();
  if (ok) closeModal();
}

function renderTagPicker(category, selected, containerId) {
  return `
    <div class="tag-picker" id="${containerId}">

    </div>
  `;
}
function addPickerTag(containerId, tag) {
  const c = document.getElementById(containerId);
  if (c.querySelector(`[data-tag="${tag}"]`)) return;
  const input = c.querySelector('.tag-picker-input');
  const span = document.createElement('span');
  span.className = 'tag image removable';
  span.dataset.tag = tag;
  span.innerHTML = `${tag}<span class="tag-close" onclick="this.parentElement.remove()">×</span>`;
  c.insertBefore(span, input);
}
function collectPickerTags(containerId) {
  const c = document.getElementById(containerId);
  return Array.from(c.querySelectorAll('.tag.removable')).map(t => t.dataset.tag);
}
// 监听回车添加自定义标签
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('tag-picker-input')) {
    e.preventDefault();
    const v = e.target.value.trim();
    if (!v) return;
    const containerId = e.target.id.replace('_input','');
    addPickerTag(containerId, v);
    e.target.value = '';
  }
});

/* ==================================================================
   导入导出
   ================================================================== */
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `seeding-hub-${fmtDate(Date.now())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出', 'success');
}
function importData() {
  if (!requireEdit()) return;
  const input = document.getElementById('fileInput');
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!imported.kols || !imported.tags) throw new Error('格式不正确');
        if (!confirm('导入会覆盖现有数据，确认继续？')) return;
        data = imported;
        saveData(); render();
        toast('导入成功', 'success');
      } catch(err) {
        toast('导入失败：' + err.message, 'error');
      }
    };
    r.readAsText(file);
  };
  input.click();
}
