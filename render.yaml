services:
  - type: web
    name: hay-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # 在 Render 控制台手动填写 Neon DSN
    disk:
      name: uploads
      mountPath: /opt/render/project/src
      sizeGB: 1
