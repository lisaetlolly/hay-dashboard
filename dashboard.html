*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f4;--surface:#fff;--border:#e4e4e7;--text:#18181b;--muted:#71717a;--accent:#18181b;--green:#16a34a;--red:#dc2626;--yellow:#d97706}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;position:fixed;inset:0;width:100vw}
#sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:16px 20px;font-size:13px;font-weight:700;letter-spacing:1px;border-bottom:1px solid var(--border)}
.nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;padding:6px 16px;cursor:pointer;color:var(--muted);border-left:2px solid transparent;transition:all .12s;font-size:13px;white-space:nowrap}
.nav-item:hover{color:var(--text);background:#f4f4f5}
.nav-item.active{color:var(--text);border-left-color:var(--accent);background:#f4f4f5;font-weight:500}
.nav-sep{height:1px;background:var(--border);margin:6px 16px}
.user-bar{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;position:relative;z-index:50;overflow:visible}
.page-title{font-size:13px;font-weight:600;flex:1}
.topbar-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.time-ctrl{display:flex;align-items:center;gap:6px;position:relative;z-index:51}
.time-ctrl select,.time-ctrl input{padding:4px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;background:var(--surface);color:var(--text);outline:none}
.time-ctrl input{width:96px}
#content{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px}
.kpi-label{font-size:11px;color:var(--muted);margin-bottom:8px}
.kpi-value{font-size:24px;font-weight:700;letter-spacing:-1px;line-height:1}
.kpi-footer{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.chg{font-weight:600;font-size:11px}
.up{color:var(--green)}.dn{color:var(--red)}.flat{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:12px;font-weight:600}
.card-sub{font-size:11px;color:var(--muted)}
.row-2-3{display:grid;grid-template-columns:2fr 3fr;gap:16px}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{padding:8px 14px;font-size:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
.tab:hover:not(.active){color:var(--text)}
.rank-list{display:flex;flex-direction:column}
.rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.rank-row:last-child{border-bottom:none}
.rank-no{width:18px;font-size:12px;color:var(--muted);text-align:center;flex-shrink:0;font-weight:600}
.rank-no.top3{color:var(--text)}
.rank-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-cat{font-size:10px;color:var(--muted)}
.rank-bar-bg{width:64px;height:3px;background:#f0f0f0;border-radius:2px;flex-shrink:0}
.rank-bar-fill{height:3px;background:var(--accent);border-radius:2px}
.rank-val{width:68px;text-align:right;font-size:12px;font-weight:600;flex-shrink:0}
.rank-chg{width:46px;text-align:right;font-size:11px;flex-shrink:0}
.cat-list{display:flex;flex-direction:column;gap:14px}
.cat-head{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px}
.cat-name{font-weight:500}
.cat-diff{font-weight:600;font-size:11px}
.bar-track{position:relative;height:5px;background:#f0f0f0;border-radius:3px}
.bar-plan{position:absolute;top:0;left:0;height:5px;background:#d4d4d8;border-radius:3px}
.bar-actual{position:absolute;top:0;left:0;height:5px;background:var(--accent);border-radius:3px}
.s-normal{color:var(--green)}.s-warning{color:var(--yellow)}.s-danger{color:var(--red)}
.action-flow{display:flex;flex-wrap:wrap;gap:8px}
.action-chip{display:flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:11px;cursor:pointer}
.action-chip:hover{border-color:#a1a1aa}
.ac-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.muted{color:var(--muted)}
.empty{text-align:center;padding:32px;color:var(--muted);font-size:12px}
.info-btn{display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;border-radius:50%;border:1px solid var(--border);
  font-size:9px;color:var(--muted);cursor:default;flex-shrink:0;margin-left:4px;
  position:relative;vertical-align:middle}
.info-btn:hover .tooltip{display:block}
.tooltip{display:none;position:absolute;left:20px;top:-4px;width:240px;
  background:#1a1a1a;color:#fff;font-size:11px;line-height:1.6;
  padding:8px 12px;border-radius:6px;z-index:1000;pointer-events:none;font-weight:400;
  white-space:normal;word-break:break-all;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.info-wrap{display:inline-flex;align-items:center}
</style>

let RAW_LOAD_ERROR = null
let RAW_LOAD_MS = null
async function _loadRawFromAPI() {
  // Neon 冷启动 5-15s，预热请求 + 主请求 35s 超时
  const t0 = Date.now()
  // 预热：先发一个 /api/health 唤醒后端，再请求数据
  try { await fetch('/api/health', { cache: 'no-store' }) } catch(_) {}
  try {
    const ctrl = new AbortController()
    const timer = setTimeout(() => ctrl.abort(), 35000)
    const res = await fetch('/api/raw-data', { cache: 'no-store', signal: ctrl.signal })
    clearTimeout(timer)
    RAW_LOAD_MS = Date.now() - t0
    if (!res.ok) { RAW_LOAD_ERROR = 'HTTP ' + res.status + '（' + RAW_LOAD_MS + 'ms）'; return }
    const data = await res.json()
    if (data._error) { RAW_LOAD_ERROR = data._error; console.warn('[RAW] DB unavailable:', data._error); return }
    Object.assign(RAW, data)
    // OFFICIAL Set 是页面加载时基于 RAW 快照建的；API 拉到新的 official_pids（如 typo 修正后的 1020815058332）必须刷一遍，
    // 否则 ProductsPage / ComparePage 用 OFFICIAL.has() 过滤会把新 PID 漏掉（症状：商品管理只剩 24 个）。
    if (Array.isArray(RAW.official_pids)) {
      OFFICIAL.clear()
      for (const p of RAW.official_pids) OFFICIAL.add(p)
    }
    console.log('[RAW] loaded in', RAW_LOAD_MS, 'ms; products=', Object.keys(data.products || {}).length, 'syzt=', (data.syzt||[]).length, 'wxst=', (data.wxst||[]).length, 'official=', OFFICIAL.size)
  } catch(e) {
    RAW_LOAD_MS = Date.now() - t0
    RAW_LOAD_ERROR = e.name === 'AbortError' ? '请求超时（>35s，Neon DB 唤醒失败）' : String(e)
    console.warn('[RAW] fetch failed after', RAW_LOAD_MS, 'ms:', e)
  }
}

const OFFICIAL = new Set(RAW.official_pids)      // depends on RAW (Python-injected)
const APP_STATE = Vue.ref(createInitialAppState()) // depends on RAW
let PLAN_LOOKUP = {}                               // populated after API fetch
// 启动时拉真账号列表 + 同步 X-Username 来源。
// 严重原则：绝不修改真实登录身份（hay_current_user）—— 只读，不写回 admin。
// 用户实际登录身份由登录页设置；这里只负责让 state.users 是真账号列表，
// 并把当前登录用户的 permissions 从 DB 刷一遍最新（避免 toggle 后没同步到这条）。
async function _initAuthFromDb() {
  try {
    const res = await fetch('/api/users')
    if (!res.ok) return
    const list = await res.json()
    const realUsers = (list || []).map(u => ({
      id: String(u.id), username: u.username, display_name: u.display_name,
      role: u.role, permissions: Array.isArray(u.permissions) ? u.permissions : [],
    }))
    if (!realUsers.length) return
    APP_STATE.value.users = realUsers

    // 读真实登录身份（登录页设置的）
    let stored = null
    try { stored = JSON.parse(localStorage.getItem('hay_current_user') || 'null') } catch {}

    if (stored && stored.username) {
      // 已登录：把 DB 里的最新 role/permissions 同步进 localStorage（不改 username/id）
      const u = realUsers.find(x => x.username === stored.username)
      if (u) {
        APP_STATE.value.currentUserId = u.id
        try {
          localStorage.setItem('hay_current_user', JSON.stringify({
            id: u.id, username: u.username, display_name: u.display_name,
            role: u.role, permissions: u.permissions || [],
          }))
        } catch {}
      } else {
        // 登录账号 DB 里找不到 → 保留 stored 让 X-Username 还能用，但提示
        console.warn('[initAuth] 登录账号', stored.username, '在 DB 里找不到')
      }
    } else {
      // 没登录身份：什么也不做，不主动塞 admin
      console.log('[initAuth] 没检测到登录身份；写操作会 401')
    }
  } catch (e) { console.warn('[initAuth]', e) }
}
;(async () => {
  await _loadRawFromAPI()
  PLAN_LOOKUP = buildPlanLookup()
  loadAppState()
  await _initAuthFromDb()  // 关键：mount 前就把真账号 + X-Username 设好
  startStateSync(15000)
  const __app = createApp(App)
  __app.config.errorHandler = (err, vm, info) => { console.error('VUE ERROR in', vm?.$options?.name, info, err) }
  __app.mount('#app')
})()
</script>
